<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,'DejaVu Sans Mono',monospace">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0720"/><stop offset="1" stop-color="#101040"/></linearGradient>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#FFC857"/></marker>
<clipPath id="round"><rect width="1000" height="290" rx="18"/></clipPath>
</defs>
<g clip-path="url(#round)">
<rect width="1000" height="290" fill="url(#bg)"/>
<text x="30" y="42" font-size="14" fill="#00E5FF" letter-spacing="1">$ cat how_it_fits_together.flow</text>
<text x="30" y="66" font-size="12" fill="#6f75aa">raw signal in, usable intelligence out</text>
<line x1="0" y1="150" x2="1000" y2="150" stroke="#2b2f66" stroke-width="2" stroke-dasharray="6 8"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" repeatCount="indefinite"/></line>
<circle r="6" cy="0" fill="#00E5FF" filter="url(#glow)"><animateMotion dur="7.5s" begin="0.0s" repeatCount="indefinite" path="M0,150 H1000"/></circle>
<circle r="6" cy="0" fill="#8B7BFF" filter="url(#glow)"><animateMotion dur="7.5s" begin="2.5s" repeatCount="indefinite" path="M0,150 H1000"/></circle>
<circle r="6" cy="0" fill="#FF6AD5" filter="url(#glow)"><animateMotion dur="7.5s" begin="5.0s" repeatCount="indefinite" path="M0,150 H1000"/></circle>
<path d="M875,195 C875,262 375,262 375,198" fill="none" stroke="#FFC857" stroke-opacity="0.7" stroke-width="1.6" stroke-dasharray="5 7" marker-end="url(#arr)"><animate attributeName="stroke-dashoffset" from="0" to="-24" dur="1.2s" repeatCount="indefinite"/></path>
<text x="625" y="262" font-size="12" fill="#FFC857" fill-opacity="0.85" text-anchor="middle">traces and evals close the loop</text>
<rect x="26" y="101" width="198" height="98" rx="16" fill="none" stroke="#00E5FF" stroke-width="3" opacity="0.15" filter="url(#glow)"><animate attributeName="opacity" values="0.95;0.15;0.15" keyTimes="0;0.35;1" dur="2.5s" begin="0.9375s" repeatCount="indefinite"/></rect>
<rect x="30" y="105" width="190" height="90" rx="12" fill="#0d0b2b" stroke="#00E5FF" stroke-opacity="0.8"/>
<text x="125.0" y="131" font-size="11" fill="#00E5FF" text-anchor="middle" letter-spacing="2">01 INGEST</text>
<text x="125.0" y="160" font-size="22" font-weight="700" fill="#F2F4FF" text-anchor="middle">video2vec</text>
<text x="125.0" y="180" font-size="12" fill="#8f94c8" text-anchor="middle">video → embeddings</text>
<rect x="276" y="101" width="198" height="98" rx="16" fill="none" stroke="#8B7BFF" stroke-width="3" opacity="0.15" filter="url(#glow)"><animate attributeName="opacity" values="0.95;0.15;0.15" keyTimes="0;0.35;1" dur="2.5s" begin="0.3125s" repeatCount="indefinite"/></rect>
<rect x="280" y="105" width="190" height="90" rx="12" fill="#0d0b2b" stroke="#8B7BFF" stroke-opacity="0.8"/>
<text x="375.0" y="131" font-size="11" fill="#8B7BFF" text-anchor="middle" letter-spacing="2">02 ORCHESTRATE</text>
<text x="375.0" y="160" font-size="22" font-weight="700" fill="#F2F4FF" text-anchor="middle">baton</text>
<text x="375.0" y="180" font-size="12" fill="#8f94c8" text-anchor="middle">DAGs, retries, sagas</text>
<rect x="526" y="101" width="198" height="98" rx="16" fill="none" stroke="#FF6AD5" stroke-width="3" opacity="0.15" filter="url(#glow)"><animate attributeName="opacity" values="0.95;0.15;0.15" keyTimes="0;0.35;1" dur="2.5s" begin="2.1875s" repeatCount="indefinite"/></rect>
<rect x="530" y="105" width="190" height="90" rx="12" fill="#0d0b2b" stroke="#FF6AD5" stroke-opacity="0.8"/>
<text x="625.0" y="131" font-size="11" fill="#FF6AD5" text-anchor="middle" letter-spacing="2">03 RETRIEVE</text>
<text x="625.0" y="160" font-size="22" font-weight="700" fill="#F2F4FF" text-anchor="middle">neural-search</text>
<text x="625.0" y="180" font-size="12" fill="#8f94c8" text-anchor="middle">dense + sparse + router</text>
<rect x="776" y="101" width="198" height="98" rx="16" fill="none" stroke="#FFC857" stroke-width="3" opacity="0.15" filter="url(#glow)"><animate attributeName="opacity" values="0.95;0.15;0.15" keyTimes="0;0.35;1" dur="2.5s" begin="1.5625s" repeatCount="indefinite"/></rect>
<rect x="780" y="105" width="190" height="90" rx="12" fill="#0d0b2b" stroke="#FFC857" stroke-opacity="0.8"/>
<text x="875.0" y="131" font-size="11" fill="#FFC857" text-anchor="middle" letter-spacing="2">04 OBSERVE</text>
<text x="875.0" y="160" font-size="22" font-weight="700" fill="#F2F4FF" text-anchor="middle">llmwatch</text>
<text x="875.0" y="180" font-size="12" fill="#8f94c8" text-anchor="middle">traces, evals, compare</text>
</g>
<rect x="0.5" y="0.5" width="999" height="289" rx="18" fill="none" stroke="#00E5FF" stroke-opacity="0.25"/>
</svg>